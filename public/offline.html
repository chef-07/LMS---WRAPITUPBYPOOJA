<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ff7a1a">
<title>You’re offline · Wrap It Up University</title>
<style>
  :root { --ink: #1f1a2e; --ink-3: #6e6985; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--ink); background: #fff6ec; }
  .card { max-width: 380px; width: 100%; text-align: center; background: #fff; border: 1px solid #f0e6da; border-radius: 18px; padding: 28px 22px; box-shadow: 0 8px 24px -16px rgba(31,26,46,.18); }
  img { width: 64px; height: 64px; }
  h1 { font-size: 22px; margin: 12px 0 6px; }
  p { color: var(--ink-3); margin: 0 0 18px; line-height: 1.5; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 12px 22px; min-height: 44px; color: #fff; background: linear-gradient(135deg, #ff7a1a, #ff4d8d); cursor: pointer; }
</style>
</head>
<body>
  <main class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>You’re offline</h1>
    <p>Training videos and your progress need the internet. Check your Wi-Fi or mobile data, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
